<!--
  TWINTHOS — REDESIGNED HERO
  Mirofish Principle 1: ONE BIG IDEA FIRST

  The hero communicates what Twinthos is in a single breath.
  Headline IS the value proposition. No abstraction.
  Black field. White type. One signal-green CTA.
  Brand mark anchors the page at the structural left margin.

  Rationale:
  - "Your operation without the glue work." names the concrete
    outcome, not a vague "managed operations" label.
  - Hero body names the three jobs that vanish (chase, copy,
    follow up) so a visitor recognises their own day.
  - Single CTA to the offer page. No secondary link competing.
  - Hero brand lockup at right is a structural anchor, not a
    corner decoration — it tells you where you are before you
    read, at the size the brand earns.
  - Type scale carries the hierarchy: label / headline / body /
    CTA. The gap between content and brand is the breathing
    room that makes the black field feel intentional.
  - No decorative SVG, no pseudo-graphics, no chips.
    The contrast between the black field and the white type
    is the design. The green button is the only colour.
-->
<section class="hero" id="hero">
  <div class="hero-inner">

    <!-- ── Content column (left, asymmetric) ── -->
    <div class="hero-content">

      <p class="hero-label">Managed operations</p>

      <h1 class="hero-headline" id="heroHeadline">
        <span class="word">Your</span>
        <span class="word">operation</span>
        <span class="word">without</span>
        <span class="word">the</span>
        <span class="word">glue</span>
        <span class="word">work</span>
        <span class="word">.</span>
      </h1>

      <p class="hero-body" data-delay="200">
        Twinthos takes the chasing, copying, updating and follow-up
        that hold every operation together — and handles it quietly,
        across the systems you already use. Your team keeps doing
        the work only people can do.
      </p>

      <a href="#offer" class="btn btn--primary hero-cta" data-delay="350">
        Assess your operation
      </a>

    </div>

    <!-- ── Brand lockup (right margin anchor) ── -->
    <div class="hero-brand" aria-hidden="true">
      <span class="logo-mark">
        <!-- Refined flat stepped-flow mark + TWINTHOS wordmark -->
        <svg viewBox="0 0 360 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="140" height="18" aria-hidden="true">
          <path d="M8 6 L48 6 L48 36 L8 36 Z" fill="#FFFFFF"/>
          <path d="M8 14 L48 14 L48 26 L8 26 Z" fill="#FFFFFF" opacity="0.85"/>
          <path d="M18 24 L48 24 L48 32 L18 32 Z" fill="#FFFFFF" opacity="0.6"/>
          <path d="M28 30 L46 30 L46 36 L28 36 Z" fill="#FFFFFF" opacity="0.4"/>
          <circle cx="48" cy="36" r="4.5" fill="#20F782"/>
          <text x="58" y="34" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.01em" fill="#FFFFFF">TWINTHOS</text>
        </svg>
        <span class="logo-wordmark">TWINTHOS</span>
      </span>
    </div>

  </div>
</section>
