<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 48" fill="none" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
  <!-- TWINTHOS LOGO — New visual system.
       Background: #050505   Text: #F4F4F0   Accent: #B7FF00
       Black field. White stepped mark. Electric acid-green signal dot.
       Refined geometry: one connected stepped form, four opacity layers,
       single signal terminus on baseline and right edge. -->

  <!-- White stepped mark — four layers stepping down to the baseline -->
  <path d="M8 6 L48 6 L48 36 L8 36 Z" fill="#F4F4F0"/>
  <path d="M8 14 L48 14 L48 26 L8 26 Z" fill="#F4F4F0" opacity="0.85"/>
  <path d="M18 24 L48 24 L48 32 L18 32 Z" fill="#F4F4F0" opacity="0.6"/>
  <path d="M28 30 L46 30 L46 36 L28 36 Z" fill="#F4F4F0" opacity="0.4"/>

  <!-- Signal dot — the terminus, on baseline (y=36) and right edge of mark (x=48) -->
  <circle cx="48" cy="36" r="4.5" fill="#B7FF00"/>

  <!-- TWINTHOS wordmark -->
  <text x="58" y="34" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.01em" fill="#F4F4F0">TWINTHOS</text>
</svg>
