<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48">
  <!-- MARK — Refined flat titanium, 120x40 scaled 2x -->
  <g transform="translate(0,0) scale(2)">
    <rect width="120" height="40" fill="#000000"/>
    <!-- Left block: the foundation (stable) -->
    <path d="M10 10 L34 10 L34 30 L10 30 Z" fill="#FFFFFF"/>
    <!-- Right blocks: stepping down — work flowing toward completion -->
    <path d="M38 10 L62 10 L62 16 L38 16 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M38 18 L62 18 L62 24 L38 24 Z" fill="#FFFFFF" opacity="0.75"/>
    <path d="M38 26 L54 26 L54 30 L38 30 Z" fill="#FFFFFF" opacity="0.5"/>
    <!-- Single green signal dot at the end of the flow -->
    <circle cx="64" cy="20" r="4.5" fill="#20F782"/>
  </g>
  <!-- WORDMARK — TWINTHOS -->
  <text x="250" y="33" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.01em" fill="#FFFFFF">TWINTHOS</text>
</svg>
