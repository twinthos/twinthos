  <style>
    /* ============ THEME (overrides engine @layer - unlayered wins) ============ */
    :root, .sw-root {
      --sw-bg: #08060f;
      --sw-ink: #f4f1fb;
      --sw-ink-soft: #9a8fc0;
      --sw-accent: #7A5CFF;
      --sw-font-display: "Fraunces", Georgia, serif;
      --sw-font-body: "Inter", -apple-system, system-ui, sans-serif;
      --sw-ease: cubic-bezier(.22,.61,.21,1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--sw-bg); overscroll-behavior: none; }
    #world { min-height: 100vh; }
    ::selection { background: rgba(122,92,255,.35); }

    /* ---- ELITE TOP BAR ---- */
    .sw-topbar {
      padding: clamp(16px, 2.2vw, 24px) clamp(20px, 4.5vw, 56px);
      background: linear-gradient(180deg, rgba(8,6,15,.86) 0%, rgba(8,6,15,.55) 78%, transparent 100%);
      backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-bottom: 1px solid rgba(244,241,251,.06);
      box-shadow: 0 1px 0 rgba(122,92,255,.05) inset;
    }
    .sw-brand { gap: 12px; }
    .sw-brand__mark {
      width: 11px; height: 24px; border-radius: 3px;
      background: linear-gradient(180deg, #9D7BFF 0%, #5B3BE0 100%);
      box-shadow: 0 0 16px rgba(122,92,255,.5), 0 4px 10px rgba(122,92,255,.28);
    }
    .sw-brand__name {
      font-weight: 500; letter-spacing: .34em; text-transform: uppercase;
      font-size: .92rem; color: var(--sw-ink);
    }
    /* nav = minimal uppercase links, NO pill chrome */
    .sw-nav {
      display: flex; gap: 4px; padding: 0;
      background: transparent; backdrop-filter: none;
      border: 0; border-radius: 0;
    }
    .sw-nav__item {
      font-family: var(--sw-font-body); font-size: .68rem; font-weight: 500;
      letter-spacing: .2em; text-transform: uppercase;
      color: rgba(154,143,192,.72); padding: 8px 15px; border-radius: 0;
      position: relative; transition: color .3s var(--sw-ease);
    }
    .sw-nav__item::after {
      content: ""; position: absolute; left: 15px; right: 15px; bottom: 2px; height: 1px;
      background: var(--sw-accent); transform: scaleX(0); transform-origin: left;
      transition: transform .4s var(--sw-ease);
      box-shadow: 0 0 8px rgba(122,92,255,.6);
    }
    .sw-nav__item:hover { color: var(--sw-ink); }
    .sw-nav__item.is-active { color: var(--sw-ink); background: transparent; }
    .sw-nav__item.is-active::after { transform: scaleX(1); }
    /* CTA = slim violet gradient pill */
    .sw-topcta {
      font-family: var(--sw-font-body); font-weight: 600; font-size: .78rem;
      letter-spacing: .08em; text-transform: uppercase;
      color: #fff; background: linear-gradient(135deg, #8B6BFF 0%, #5B3BE0 100%);
      border: 1px solid rgba(255,255,255,.14); padding: 12px 26px;
      border-radius: 999px; box-shadow: 0 8px 24px rgba(91,59,224,.35), inset 0 1px 0 rgba(255,255,255,.18);
      transition: transform .3s var(--sw-ease), box-shadow .3s var(--sw-ease);
    }
    .sw-topcta:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(91,59,224,.5), inset 0 1px 0 rgba(255,255,255,.2); }

    /* ---- COPY TREATMENT + TEXT MOTION ---- */
    .sw-copy { left: clamp(22px, 6vw, 84px); top: 46%; width: min(44vw, 560px); }
    .sw-copy__num {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: .7rem; letter-spacing: .34em; color: rgba(154,143,192,.62);
      border: 1px solid rgba(154,143,192,.18); border-radius: 999px;
      padding: 7px 16px; display: inline-block; backdrop-filter: blur(4px);
    }
    .sw-copy__eyebrow {
      font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 500;
      margin-top: 22px; letter-spacing: .42em; font-size: .72rem;
    }
    .sw-copy__title {
      font-weight: 340; font-size: clamp(2.6rem, 5.2vw, 4.4rem);
      margin: 18px 0 0; letter-spacing: -.024em; line-height: 1.02;
      text-shadow: 0 2px 34px rgba(0,0,0,.5);
    }
    .sw-copy__body {
      margin-top: 22px; font-size: clamp(1rem, 1.22vw, 1.13rem); line-height: 1.6;
      color: rgba(244,241,251,.8); max-width: 44ch;
      text-shadow: 0 1px 18px rgba(0,0,0,.5);
    }
    .sw-copy__tags { gap: 10px; margin-top: 30px; }
    .sw-copy__tags li {
      font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .68rem;
      letter-spacing: .12em; text-transform: uppercase; font-weight: 500;
      color: rgba(244,241,251,.85); padding: 8px 16px; border-radius: 999px;
      background: rgba(122,92,255,.10); border: 1px solid rgba(122,92,255,.22);
      backdrop-filter: blur(6px); transition: background .3s;
    }
    .sw-copy__tags li:hover { background: rgba(122,92,255,.2); }
    .sw-btn { letter-spacing: .06em; }
    .sw-btn--primary {
      color: #0c0814; background: #fff;
      box-shadow: 0 10px 30px rgba(122,92,255,.4);
    }
    .sw-btn--ghost {
      color: var(--sw-ink); border: 1px solid rgba(244,241,251,.4);
      background: rgba(8,6,15,.3); backdrop-filter: blur(6px);
    }
    /* sub-element choreography hooks (driven by JS) */
    .sw-copy .m-el { will-change: transform, opacity; }
    .sw-ghostnum {
      position: absolute; z-index: 0; pointer-events: none;
      font-family: var(--sw-font-display); font-style: italic; font-weight: 200;
      right: 2vw; top: 12vh; font-size: min(30vw, 420px); line-height: 1;
      color: transparent; -webkit-text-stroke: 1px rgba(122,92,255,.12);
      text-shadow: 0 0 80px rgba(122,92,255,.05);
      user-select: none; opacity: .9;
      will-change: transform;
    }
    /* copy reads above ghost, below nothing */
    .sw-copy { z-index: 3; }

    /* scrollbar hairline - thinner, glowing */
    .sw-scrollbar { height: 2px; }
    .sw-scrollbar span { box-shadow: 0 0 10px rgba(122,92,255,.7); }

    /* route rail - refined */
    .sw-route__dot i { background: rgba(122,92,255,.28); }
    .sw-route__dot.is-active i { background: var(--sw-accent); box-shadow: 0 0 0 4px rgba(122,92,255,.2), 0 0 14px rgba(122,92,255,.7); }

    @media (max-width: 860px) {
      .sw-copy { left: clamp(20px, 6vw, 30px); right: clamp(20px, 6vw, 30px); top: auto; bottom: calc(clamp(72px, 14vh, 118px)); width: auto; max-width: 92vw; }
      .sw-copy__title { font-size: clamp(2rem, 8.2vw, 2.9rem); }
      .sw-ghostnum { right: 0; top: 8vh; font-size: 46vw; opacity: .55; }
      .sw-nav { display: none; }
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Twinthos', href: '#top' },
      cta: { label: 'Hire Twinthos', href: 'mailto:hello@twinthos.com?subject=Hire%20Twinthos' },
      hint: 'scroll to fly through your AI team',
      diveScroll: 1.25,
      connScroll: 0.7,
      atmosphere: true,
      nav: true,
      sections: [
        {
          id: 'why', label: 'Why we exist',
          still: 'assets/stills/frame-a.jpg',
          clip: 'assets/vid/hero.mp4',
          clipMobile: 'assets/vid/hero-m.mp4',
          accent: '#7A5CFF',
          eyebrow: 'Why we exist',
          title: 'Your business, running itself.',
          body: 'You did not open your doors to be the one still at it at 10:47pm. Twinthos gives you six digital workers who answer, chase, file and follow up - so the work gets done, with or without you. The business runs. You get your evenings back.',
          tags: ['Six AI workers', 'Never sleep', 'One flat fee'],
        },
        {
          id: 'front', label: 'The Front Desk',
          still: 'assets/stills/plate-02.jpg',
          accent: '#7A5CFF',
          eyebrow: 'The Front Desk',
          title: 'Answers your emails.',
          body: 'Reads every message, replies to the routine ones in your tone, and hands you only the ones that truly need you. Your inbox, handled before you open it.',
          tags: ['Your tone', 'Routine handled', 'Only the real ones reach you'],
        },
        {
          id: 'accounts', label: 'The Accounts Desk',
          still: 'assets/stills/plate-03.jpg',
          accent: '#9B7EBD',
          eyebrow: 'The Accounts Desk',
          title: 'Chases the money.',
          body: 'Watches invoices, spots late payments, sends polite reminders, and flags anything odd before it becomes a problem. Late payers, politely chased.',
          tags: ['Invoice watch', 'Polite reminders', 'Early warnings'],
        },
        {
          id: 'sales', label: 'The Sales Desk',
          still: 'assets/stills/plate-04.jpg',
          accent: '#7A5CFF',
          eyebrow: 'The Sales Desk',
          title: 'Books your meetings.',
          body: 'Talks to people who come to your website, finds the ones actually ready to buy, and puts them in your calendar. Ready buyers, booked in.',
          tags: ['Lead qualification', 'Calendar booked', 'No warm lead slips'],
        },
        {
          id: 'knowledge', label: 'The Knowledge Desk',
          still: 'assets/stills/plate-05.jpg',
          accent: '#9B7EBD',
          eyebrow: 'The Knowledge Desk',
          title: 'Knows everything.',
          body: 'Learns your business from your own files and answers your team\'s questions instantly. Answers in seconds - not from you.',
          tags: ['Learns your files', 'Instant answers', 'No document hunting'],
        },
        {
          id: 'compliance', label: 'The Compliance Desk',
          still: 'assets/stills/plate-06.jpg',
          accent: '#C41E3A',
          eyebrow: 'The Compliance Desk',
          title: 'Watches the fine print.',
          body: 'Checks outgoing messages and contracts for mistakes or risky wording, so you never embarrass yourself or break a rule. A careful reader on every word you send.',
          tags: ['Contract check', 'Mistake guard', 'Rule-safe'],
        },
        {
          id: 'operations', label: 'The Operations Desk',
          still: 'assets/stills/plate-07.jpg',
          accent: '#7A5CFF',
          eyebrow: 'The Operations Desk',
          title: 'Finds the slowdowns.',
          body: 'Watches how your business actually runs and automates the repetitive steps that eat your team\'s hours. Finds the bottlenecks - and clears them.',
          tags: ['Process watch', 'Automation', 'Hours given back'],
        },
        {
          id: 'how', label: 'How it works',
          still: 'assets/stills/plate-08.jpg',
          accent: '#9B7EBD',
          eyebrow: 'How it works',
          title: 'Live in 14 days. You do two hours of talking.',
          body: 'Week one we learn your business. Week two we build your team and you watch them work with training wheels. Then a human supervises them around the clock. The plumbers come in. You keep working.',
          tags: ['14 days', 'Two hours of talking', 'Human supervision'],
        },
        {
          id: 'price', label: 'One flat fee',
          still: 'assets/stills/plate-09.jpg',
          accent: '#27c93f',
          eyebrow: 'Pricing',
          title: '£5,000 a month. For the whole team.',
          body: 'All six workers, setup, UK hosting, human supervision, the weekly report - one predictable fee, less than the cost of one junior hire. No meter running in the background. Live in 14 days. Cancel with 30 days\' notice. Your data stays in the UK, never used to train AI.',
          tags: ['No setup fees', 'No usage limits', 'Cancel anytime'],
          cta: {
            primary: { label: 'Hire Twinthos', href: 'mailto:hello@twinthos.com?subject=Hire%20Twinthos' },
            secondary: { label: 'Get your 7-minute preview - £999', href: 'mailto:hello@twinthos.com?subject=7-minute%20preview' },
          },
        },
      ],
      connectors: [],
    });

    /* ============ CHOREOGRAPHY: text motion across the screen as you scroll ============
       Each layer spans diveScroll(1.25) viewport-heights. Copy sub-elements enter
       with stagger, ride upward through the layer, and exit - so text is always
       moving. Ghost layer numerals drift slower (parallax). */
    (function () {
      var DW = 1.25;
      var copies = document.querySelectorAll('.sw-copylayer .sw-copy');
      var ghostHost = document.querySelector('.sw-copylayer');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var NUM = copies.length;
      var els = [], ghosts = [], tags = [];
      if (!ghostHost || !NUM) return;

      copies.forEach(function (c, i) {
        var num = c.querySelector('.sw-copy__num');
        var eyebrow = c.querySelector('.sw-copy__eyebrow');
        var title = c.querySelector('.sw-copy__title');
        var body = c.querySelector('.sw-copy__body');
        var tagList = c.querySelector('.sw-copy__tags');
        var tagItems = tagList ? Array.prototype.slice.call(tagList.children) : [];
        els.push({ num: num, eyebrow: eyebrow, title: title, body: body });
        tags.push(tagItems);

        // ghost numeral per layer
        var g = document.createElement('div');
        g.className = 'sw-ghostnum';
        g.textContent = '0' + (i + 1);
        ghostHost.appendChild(g);
        ghosts.push(g);
      });

      var clamp = function (x, a, b) { return Math.min(b, Math.max(a, x)); };
      var smooth = function (x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
      var vh = window.innerHeight;

      function frame() {
        var y = window.scrollY || window.pageYOffset;
        for (var i = 0; i < NUM; i++) {
          var s0 = i * DW * vh, s1 = (i + 1) * DW * vh;
          var p = clamp((y - s0) / (s1 - s0), 0, 1);
          // opacity envelope: fade in 0.04-0.20, out 0.86-0.97
          var inA = smooth(clamp((p - 0.04) / 0.16, 0, 1));
          var outA = 1 - smooth(clamp((p - 0.86) / 0.11, 0, 1));
          var vis = Math.min(inA, outA);
          // continuous upward drift: rises from +90px to -140px across the layer
          var drift = 90 * (1 - smooth(clamp(p / 0.18, 0, 1))) - 140 * smooth(clamp((p - 0.80) / 0.18, 0, 1));

          var e = els[i];
          if (e.num) { e.num.style.opacity = (0.55 * vis).toFixed(3); e.num.style.transform = 'translateY(' + (drift * 0.5).toFixed(1) + 'px)'; }
          if (e.eyebrow) { e.eyebrow.style.opacity = (vis).toFixed(3); e.eyebrow.style.transform = 'translateX(' + ((1 - inA) * 34).toFixed(1) + 'px) translateY(' + (drift * 0.72).toFixed(1) + 'px)'; }
          if (e.title) {
            var ti = smooth(clamp((p - 0.06) / 0.2, 0, 1));
            var ls = -0.024 - (1 - ti) * 0.03;
            e.title.style.opacity = (Math.min(inA, outA) * ti).toFixed(3);
            e.title.style.transform = 'translateY(' + (drift * 0.9).toFixed(1) + 'px) scale(' + (0.985 + ti * 0.015).toFixed(4) + ')';
            e.title.style.letterSpacing = ls.toFixed(4) + 'em';
          }
          if (e.body) { e.body.style.opacity = (vis * smooth(clamp((p - 0.10) / 0.14, 0, 1))).toFixed(3); e.body.style.transform = 'translateY(' + (drift * 1.05).toFixed(1) + 'px)'; }

          var tItems = tags[i];
          for (var k = 0; k < tItems.length; k++) {
            var tv = smooth(clamp((p - 0.14 - k * 0.035) / 0.1, 0, 1));
            tItems[k].style.opacity = (vis * tv).toFixed(3);
            tItems[k].style.transform = 'translateY(' + ((1 - tv) * 22 + drift * 1.15).toFixed(1) + 'px)';
          }

          var g = ghosts[i];
          if (g) { g.style.transform = 'translateY(' + (-y * 0.04 + p * 60).toFixed(1) + 'px)'; }
        }
        requestAnimationFrame(frame);
      }
      function onResize() { vh = window.innerHeight; }
      window.addEventListener('resize', onResize);
      if (!reduce) requestAnimationFrame(frame);
    })();
  </script>
</body>
