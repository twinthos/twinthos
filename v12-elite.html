  <style>
    /* ============ THEME (overrides engine @layer - unlayered wins) ============ */
    :root, .sw-root {
      --sw-bg: #08060f;
      --sw-ink: #f4f1fb;
      --sw-ink-soft: #9a8fc0;
      --sw-accent: #7A5CFF;
      --sw-font-display: "Fraunces", Georgia, serif;
      --sw-font-body: "Inter", -apple-system, system-ui, sans-serif;
      --sw-ease: cubic-bezier(.22,.61,.21,1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--sw-bg); overscroll-behavior: none; }
    #world { min-height: 100vh; }
    ::selection { background: rgba(122,92,255,.35); }

    /* ---- ELITE TOP BAR (no backdrop-filter: full-width blur over video freezes
       mobile GPUs - the #1 suspect for 'page won't scroll'. Solid gradient instead.) ---- */
    .sw-topbar {
      padding: clamp(16px, 2.2vw, 24px) clamp(20px, 4.5vw, 56px);
      background: linear-gradient(180deg, rgba(8,6,15,.94) 0%, rgba(8,6,15,.82) 60%, rgba(8,6,15,.35) 100%);
      border-bottom: 1px solid rgba(244,241,251,.05);
      box-shadow: 0 1px 0 rgba(122,92,255,.04) inset;
    }
    .sw-brand { gap: 12px; }
    .sw-brand__mark {
      width: 11px; height: 24px; border-radius: 3px;
      background: linear-gradient(180deg, #9D7BFF 0%, #5B3BE0 100%);
      box-shadow: 0 0 16px rgba(122,92,255,.5), 0 4px 10px rgba(122,92,255,.28);
    }
    .sw-brand__name {
      font-weight: 500; letter-spacing: .34em; text-transform: uppercase;
      font-size: .92rem; color: var(--sw-ink);
    }
    /* nav = minimal uppercase links, NO pill chrome */
    .sw-nav {
      display: flex; gap: 4px; padding: 0;
      background: transparent; backdrop-filter: none;
      border: 0; border-radius: 0;
    }
    .sw-nav__item {
      font-family: var(--sw-font-body); font-size: .68rem; font-weight: 500;
      letter-spacing: .2em; text-transform: uppercase;
      color: rgba(154,143,192,.72); padding: 8px 15px; border-radius: 0;
      position: relative; transition: color .3s var(--sw-ease);
    }
    .sw-nav__item::after {
      content: ""; position: absolute; left: 15px; right: 15px; bottom: 2px; height: 1px;
      background: var(--sw-accent); transform: scaleX(0); transform-origin: left;
      transition: transform .4s var(--sw-ease);
      box-shadow: 0 0 8px rgba(122,92,255,.6);
    }
    .sw-nav__item:hover { color: var(--sw-ink); }
    .sw-nav__item.is-active { color: var(--sw-ink); background: transparent; }
    .sw-nav__item.is-active::after { transform: scaleX(1); }
    /* CTA = slim violet gradient pill */
    .sw-topcta {
      font-family: var(--sw-font-body); font-weight: 600; font-size: .78rem;
      letter-spacing: .08em; text-transform: uppercase;
      color: #fff; background: linear-gradient(135deg, #8B6BFF 0%, #5B3BE0 100%);
      border: 1px solid rgba(255,255,255,.14); padding: 12px 26px;
      border-radius: 999px; box-shadow: 0 8px 24px rgba(91,59,224,.35), inset 0 1px 0 rgba(255,255,255,.18);
      transition: transform .3s var(--sw-ease), box-shadow .3s var(--sw-ease);
    }
    .sw-topcta:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(91,59,224,.5), inset 0 1px 0 rgba(255,255,255,.2); }

    /* ---- COPY TREATMENT + TEXT MOTION ---- */
    .sw-copy { left: clamp(22px, 6vw, 84px); top: 46%; width: min(44vw, 560px); }
    .sw-copy__num {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: .7rem; letter-spacing: .34em; color: rgba(154,143,192,.62);
      border: 1px solid rgba(154,143,192,.18); border-radius: 999px;
      padding: 7px 16px; display: inline-block; 
    }
    .sw-copy__eyebrow {
      font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 500;
      margin-top: 22px; letter-spacing: .42em; font-size: .72rem;
    }
    .sw-copy__title {
      font-weight: 340; font-size: clamp(2.6rem, 5.2vw, 4.4rem);
      margin: 18px 0 0; letter-spacing: -.024em; line-height: 1.02;
      text-shadow: 0 2px 34px rgba(0,0,0,.5);
    }
    .sw-copy__body {
      margin-top: 22px; font-size: clamp(1rem, 1.22vw, 1.13rem); line-height: 1.6;
      color: rgba(244,241,251,.8); max-width: 44ch;
      text-shadow: 0 1px 18px rgba(0,0,0,.5);
    }
    .sw-copy__tags { gap: 10px; margin-top: 30px; }
    .sw-copy__tags li {
      font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .68rem;
      letter-spacing: .12em; text-transform: uppercase; font-weight: 500;
      color: rgba(244,241,251,.85); padding: 8px 16px; border-radius: 999px;
      background: rgba(122,92,255,.10); border: 1px solid rgba(122,92,255,.22);
       transition: background .3s;
    }
    .sw-copy__tags li:hover { background: rgba(122,92,255,.2); }
    .sw-btn { letter-spacing: .06em; }
    .sw-btn--primary {
      color: #0c0814; background: #fff;
      box-shadow: 0 10px 30px rgba(122,92,255,.4);
    }
    .sw-btn--ghost {
      color: var(--sw-ink); border: 1px solid rgba(244,241,251,.4);
      background: rgba(8,6,15,.3); 
    }

    /* ---- LIGHTWEIGHT TEXT CHOREOGRAPHY (CSS-transition on state change only - NO per-frame writes) ----
       The engine owns whole-copy opacity + video scrub. This adds a data-state on each
       .sw-copy (entering/active/exiting) toggled ONLY at threshold crossings, so children
       stagger in via pure CSS transitions - zero per-frame JS style churn (that stall is
       what broke v12.1). Layer 0 greets fully at load (never hidden). */
    .sw-copy__eyebrow, .sw-copy__title, .sw-copy__body, .sw-copy__tags li, .sw-copy__num {
      transition: opacity .6s var(--sw-ease), transform .6s var(--sw-ease), filter .6s var(--sw-ease), letter-spacing .6s var(--sw-ease);
      will-change: transform, opacity;
    }
    .sw-copy[data-state="entering"] .sw-copy__eyebrow,
    .sw-copy[data-state="entering"] .sw-copy__title,
    .sw-copy[data-state="entering"] .sw-copy__body,
    .sw-copy[data-state="entering"] .sw-copy__num { opacity: 0; }
    .sw-copy[data-state="entering"] .sw-copy__eyebrow { transform: translateY(18px); filter: blur(3px); letter-spacing: .5em; }
    .sw-copy[data-state="entering"] .sw-copy__title  { transform: translateY(26px) scale(.965); }
    .sw-copy[data-state="entering"] .sw-copy__body   { transform: translateY(18px); filter: blur(2px); }
    .sw-copy[data-state="entering"] .sw-copy__num    { transform: translateY(12px); }
    .sw-copy[data-state="entering"] .sw-copy__tags li { opacity: 0; transform: translateY(14px) scale(.94); }
    /* active = settled, staggered in */
    .sw-copy[data-state="active"] .sw-copy__eyebrow { transition-delay: .05s; }
    .sw-copy[data-state="active"] .sw-copy__title   { transition-delay: .13s; }
    .sw-copy[data-state="active"] .sw-copy__body    { transition-delay: .22s; }
    .sw-copy[data-state="active"] .sw-copy__tags li { transition-delay: .30s; }
    .sw-copy[data-state="active"] .sw-copy__tags li:nth-child(2) { transition-delay: .36s; }
    .sw-copy[data-state="active"] .sw-copy__tags li:nth-child(3) { transition-delay: .42s; }
    /* exiting = gentle rise before the engine fades the layer out */
    .sw-copy[data-state="exiting"] .sw-copy__title  { transform: translateY(-16px); opacity: .6; }
    .sw-copy[data-state="exiting"] .sw-copy__body   { transform: translateY(-22px); opacity: .5; }
    .sw-copy[data-state="exiting"] .sw-copy__tags li { transform: translateY(-26px); opacity: .4; }
    @media (max-width: 860px) {
      .sw-copy__eyebrow, .sw-copy__title, .sw-copy__body, .sw-copy__tags li, .sw-copy__num { transition-duration: .4s; }
      .sw-copy[data-state="active"] .sw-copy__eyebrow { transition-delay: 0s; }
      .sw-copy[data-state="active"] .sw-copy__title   { transition-delay: .06s; }
      .sw-copy[data-state="active"] .sw-copy__body    { transition-delay: .12s; }
    }
    /* sub-element choreography hooks (driven by JS) */
    .sw-copy .m-el { will-change: transform, opacity; }
    
    /* scrollbar hairline - thinner, glowing */
    .sw-scrollbar { height: 2px; }
    .sw-scrollbar span { box-shadow: 0 0 10px rgba(122,92,255,.7); }

    /* route rail - refined */
    .sw-route__dot i { background: rgba(122,92,255,.28); }
    .sw-route__dot.is-active i { background: var(--sw-accent); box-shadow: 0 0 0 4px rgba(122,92,255,.2), 0 0 14px rgba(122,92,255,.7); }

    @media (max-width: 860px) {
      .sw-copy { left: clamp(20px, 6vw, 30px); right: clamp(20px, 6vw, 30px); top: auto; bottom: calc(clamp(72px, 14vh, 118px)); width: auto; max-width: 92vw; }
      .sw-copy__title { font-size: clamp(2rem, 8.2vw, 2.9rem); }
        .sw-nav { display: none; }
    }
  </style>

    /* ============ LIGHTWEIGHT STATE TOGGLER ============
       Sets data-state (entering/active/exiting) on each .sw-copy ONLY when a layer
       crosses a threshold - CSS transitions do the visible stagger. No per-frame
       writes. Layer 0 is 'active' from the start so the headline greets at load. */
    (function () {
      var DW = 1.25, copies = document.querySelectorAll('.sw-copy'), last = [];
      if (!copies.length) return;
      var clamp = function (x, a, b) { return Math.min(b, Math.max(a, x)); };
      function update() {
        var y = window.scrollY || window.pageYOffset;
        var vh = window.innerHeight;
        for (var i = 0; i < copies.length; i++) {
          var s0 = i * DW * vh, s1 = (i + 1) * DW * vh;
          var p = clamp((y - s0) / (s1 - s0), 0, 1);
          var st;
          if (i === 0) st = (p > 0.88) ? 'exiting' : 'active';
          else if (p < 0.10) st = 'entering';
          else if (p > 0.86) st = 'exiting';
          else st = 'active';
          if (last[i] !== st) { copies[i].setAttribute('data-state', st); last[i] = st; }
        }
      }
      var ticking = false;
      window.addEventListener('scroll', function () {
        if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; update(); }); }
      }, { passive: true });
      window.addEventListener('resize', update, { passive: true });
      update();
    })();
