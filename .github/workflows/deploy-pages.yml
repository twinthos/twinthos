name: Deploy website
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source pages and assets
        run: |
          python3 _src/build.py
          python3 - <<'PY'
          from pathlib import Path
          built = Path('engineering/index.html').read_text()
          assert 'Trust the' in built and 'reference_adapter.py' in built
          assert '46 automated tests' not in Path('security/index.html').read_text()
          assert 'THE END OF' in Path('index.html').read_text()
          PY
          python3 _src/homepage_check.py
          node --check assets/tw.js
          node --check assets/experience.js
      - name: Prepare public site
        run: |
          python3 _src/stage_public_site.py "$RUNNER_TEMP/site"
          test ! -e "$RUNNER_TEMP/site/hotbox-pitch-context.md"
          test ! -e "$RUNNER_TEMP/site/engagement-report.pdf"
          test ! -e "$RUNNER_TEMP/site/jobs_opportunities.pdf"
          test ! -e "$RUNNER_TEMP/site/_src"
          test ! -e "$RUNNER_TEMP/site/DEPLOYMENT.md"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
