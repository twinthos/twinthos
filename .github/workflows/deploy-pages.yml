name: Deploy website
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source pages and assets
        run: |
          python3 _src/build.py
          python3 - <<'PY'
          from pathlib import Path
          built = Path('engineering/index.html').read_text()
          assert 'Trust the' in built and 'reference_adapter.py' in built
          assert '46 automated tests' not in Path('security/index.html').read_text()
          assert 'One message.' in Path('index.html').read_text()
          PY
          python3 _src/homepage_check.py
          node --check assets/tw.js
      - name: Prepare public site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github --exclude=./_src --exclude=./_headers -cf - . | tar -xf - -C "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/.well-known/oauth-protected-resource"
          test ! -e "$RUNNER_TEMP/site/_src"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
