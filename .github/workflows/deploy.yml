name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: python3 _src/build.py
      - name: Stage only public website files
        run: |
          mkdir -p .publish
          for file in .nojekyll 404.html CNAME favicon.svg index.html indexnow-key.txt llms.txt og.png robots.txt sitemap.xml; do
            if test -f "$file"; then cp "$file" .publish/; fi
          done
          for dir in about assets book faq how-it-works images notes operations-audit pricing privacy security terms; do
            if test -d "$dir"; then cp -R "$dir" .publish/; fi
          done
          for dir in audit contact demo demos questions services thankyou; do
            if test -f "$dir/index.html"; then mkdir -p ".publish/$dir"; cp "$dir/index.html" ".publish/$dir/"; fi
          done
          test -f .publish/index.html
          test ! -e .publish/conversations
          test ! -e .publish/memory
          test ! -e .publish/vault
          test ! -e .publish/brain
          test ! -e .publish/_src
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
