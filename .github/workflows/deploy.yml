name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: python3 _src/build.py
      - name: Stage approved public website files only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .publish
          for file in .nojekyll 404.html CNAME favicon.svg index.html indexnow-key.txt llms.txt og.png robots.txt sitemap.xml ai-catalog.json privacy.html mob_hero_t0.8.png; do
            if test -f "$file"; then cp "$file" .publish/; fi
          done
          for dir in .well-known about assets book faq how-it-works images notes operations-audit pricing privacy security terms workforce; do
            if test -d "$dir"; then cp -R "$dir" .publish/; fi
          done
          for dir in audit contact demo demos questions services thankyou; do
            if test -f "$dir/index.html"; then
              mkdir -p ".publish/$dir"
              cp "$dir/index.html" ".publish/$dir/"
            fi
          done
          test -s .publish/index.html
          test -s .publish/CNAME
      - name: Fail closed on private or executable files
        shell: bash
        run: |
          set -euo pipefail
          if find .publish -type l | grep .; then
            echo "::error::Symlinks cannot be published."
            exit 1
          fi
          if find .publish -type f | grep -Ei '(^|/)(brain|conversations|memory|vault|history|terminal|skills|site|_src|\.git)(/|$)|(^|/)(SOUL\.md|CHANGELOG\.md|\.env[^/]*|hotbox-pitch-.*|engagement-report\..*|jobs_opportunities\.pdf|offers\.md)$|\.(py|pyc|sh|md|pem|p12|pfx|key|sqlite|db|log|bak|yml|yaml|toml|jsonl)$'; then
            echo "::error::Unsafe file detected in Pages artifact; deployment stopped."
            exit 1
          fi
          echo "Publication artifact passed path and file-type checks."
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
