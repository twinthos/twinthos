name: Security and Site Quality Gate

on:
  push:
    branches: [main, gh-pages]
  pull_request:
    branches: [main, gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private workspace files
        shell: bash
        run: |
          set -euo pipefail
          git ls-files > /tmp/twinthos-tracked.txt
          if grep -Ei '^(brain|conversations|memory|vault|history|terminal|skills|site|docs|editorial|ci)/|^(SOUL\.md|hotbox-pitch-.*|engagement-audit\.md|engagement-report\..*|jobs_opportunities\.pdf|offers\.md)$' /tmp/twinthos-tracked.txt; then
            echo "::error::Private workspace or reports are tracked. Remove them before merging or publishing."
            exit 1
          fi
          echo "No known private workspace paths tracked."
      - name: Build source when available
        shell: bash
        run: |
          set -euo pipefail
          if test -f _src/build.py; then
            python3 _src/build.py
          fi
      - name: Verify essential public pages
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -qi '<title' index.html
          grep -qi 'name="description"' index.html
          test -s CNAME
          echo "Essential public site files present."
