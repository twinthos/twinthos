name: PR Quality Gate

on:
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: python3 _src/build.py
      - name: Check for broken links
        run: |
          python3 -c "
import re, glob, os
errors = []
for f in glob.glob('*.html') + glob.glob('**/*.html', recursive=True):
    if f.startswith('_src'): continue
    with open(f) as fh:
        content = fh.read()
    for m in re.finditer(r'href=\"([^\"]+)\"', content):
        href = m.group(1)
        if href.startswith('http') or href.startswith('#') or href.startswith('mailto'): continue
        path = href.split('#')[0].split('?')[0]
        if path and not os.path.exists(path) and not os.path.exists(path + '.html') and not os.path.exists(path + '/index.html'):
            errors.append(f'{f}: {href}')
if errors:
    print('Broken links found:')
    for e in errors[:20]: print(e)
    exit(1)
print('No broken internal links found.')
"
      - name: Validate HTML basics
        run: |
          python3 -c "
import glob
for f in glob.glob('*.html'):
    with open(f) as fh: c = fh.read()
    if '<title>' not in c and '<title ' not in c:
        print(f'MISSING TITLE: {f}')
    if 'meta name=\"description\"' not in c:
        print(f'MISSING META DESC: {f}')
print('HTML basic checks done.')
"
