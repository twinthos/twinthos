name: Website source verification
on:
  pull_request:
  push:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build from source
        run: python3 _src/build.py
      - name: Check source JavaScript syntax
        run: node --check assets/tw.js
      - name: Check homepage design and motion contracts
        run: python3 _src/homepage_check.py
      - name: Verify publication boundary
        run: |
          python3 _src/stage_public_site.py "$RUNNER_TEMP/stage-test"
          test ! -e "$RUNNER_TEMP/stage-test/hotbox-pitch-context.md"
          test ! -e "$RUNNER_TEMP/stage-test/engagement-report.pdf"
          test ! -e "$RUNNER_TEMP/stage-test/_src"
      - name: Install Chromium for visual verification
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test real mobile/tablet/desktop rendering
        run: python3 _src/visual_check.py
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twinthos-2027-site-visual-qa
          path: _src/qa-shots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify content, structure and public claims
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home = Path("index.html").read_text(encoding="utf-8")
          security = Path("security/index.html").read_text(encoding="utf-8")
          engineering = Path("engineering/index.html").read_text(encoding="utf-8")
          css = Path("assets/tw.css").read_text(encoding="utf-8")
          assert "Your business moves." in home
          assert "TWINTHOS / NON-HUMAN INTELLIGENCE" in home
          assert "/engineering/" in home and "/engineering/" in security\n          assert "data-w-part=\"card\"" in home and "data-w-part=\"memory\"" in home\n          assert "long-term memory" in Path("about/index.html").read_text(encoding="utf-8").lower()\n          assert "card" in security.lower()
          assert "reference_adapter.py --demo" in engineering
          assert "Not the claim" in engineering
          assert ".eng-proof-grid" in css
          form = Path("book/index.html").read_text(encoding="utf-8")
          js = Path("assets/tw.js").read_text(encoding="utf-8")
          assert 'value="security"' in form and 'security:\'AI security review\'' in js
          pricing = Path("pricing/index.html").read_text(encoding="utf-8")
          assert "home-investment-managed" in pricing
          assert "£999" in pricing and "£5,000" in pricing
          assert "46 automated tests" not in security
          for title, body in [("home",home),("security",security),("engineering",engineering)]:
              assert "<main id=\"main\">" in body and "</main>" in body, title
              assert "<title>" in body, title
          print("PASS: source build, 2027 trust narrative, card/memory, engineering evidence and privacy")
          PY
