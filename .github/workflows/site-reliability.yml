name: Website reliability
on:
  push:
    branches: [gh-pages, fix/mobile-nav-hero-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-and-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild website from canonical source
        run: python3 _src/build.py
      - name: Verify public-site security invariants
        run: python3 _src/site_security_check.py
      - name: Browser prerequisites
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test first paint, real links and mobile navigation
        run: python3 _src/site_reliability_check.py
      - name: Save mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twinthos-mobile-navigation-qa
          path: _src/qa-mobile/
          if-no-files-found: ignore
          retention-days: 7
